<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="NAWA | نوى للعطور — عطور شرقية وفرنسية فاخرة بتركيز Extrait de Parfum وثبات يدوم. تصفح الكتالوج واطلب عبر واتساب." />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="robots" content="index, follow" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- إحساس التطبيق لما تتحفظ على شاشة الموبايل -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="نوى" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <meta property="og:site_name" content="NAWA | نوى للعطور" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:title" content="NAWA | نوى للعطور" />
    <meta property="og:description" content="عطور شرقية وفرنسية فاخرة بتركيز عالٍ وثبات يدوم — تصفح الكتالوج واطلب عبر واتساب." />
    <meta property="og:image" content="/products/Naseem_50ml.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NAWA | نوى للعطور" />
    <meta name="twitter:description" content="عطور شرقية وفرنسية فاخرة بتركيز عالٍ وثبات يدوم — تصفح الكتالوج واطلب عبر واتساب." />
    <meta name="twitter:image" content="/products/Naseem_50ml.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- أوزان Cairo المستعملة فعلاً: 400/600/700/800/900 (حُذف 300/500) — وAref Ruqaa للعناوين (حُذف Amiri لأنه fallback غير مستعرض) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>NAWA | نوى للعطور</title>
  </head>
  <body>
    <div id="initial-preloader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a;color:#fffdf6;font-family:Cairo,system-ui,sans-serif;">
      <div style="display:grid;place-items:center;height:96px;width:96px;border-radius:16px;background:#fff;padding:8px;box-shadow:0 20px 60px rgba(0,0,0,.4);">
        <img src="/logo.png" alt="NAWA" style="height:100%;width:100%;object-fit:contain;" />
      </div>
      <h1 style="margin-top:24px;font-family:'Aref Ruqaa',serif;font-size:48px;font-weight:700;letter-spacing:.05em;">NAWA</h1>
      <p style="margin-top:8px;font-size:12px;letter-spacing:.3em;opacity:.7;">عطور تُشبهك</p>
      <div style="position:absolute;bottom:64px;left:50%;transform:translateX(-50%);width:192px;">
        <div style="height:2px;width:100%;overflow:hidden;border-radius:9999px;background:rgba(255,253,246,.1);">
          <div style="height:100%;width:40%;background:#fffdf6;border-radius:9999px;animation:nawa-preload 1.2s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>
    <style>
      @keyframes nawa-preload {
        0% { transform: translateX(-100%); width: 30%; }
        50% { transform: translateX(100%); width: 60%; }
        100% { transform: translateX(250%); width: 30%; }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
